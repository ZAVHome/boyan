# ==============================================================================
# Конфигурация Nginx для Next-Gen OPDS Suite («Боян»)
# Размещение: /etc/nginx/sites-available/boyan
# Активация: ln -s /etc/nginx/sites-available/boyan /etc/nginx/sites-enabled/
# ==============================================================================

# Пул бэкенда Go (по умолчанию слушает 127.0.0.1:8080)
upstream boyan_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    
    # Замените your-domain.com на ваш домен или IP-адрес сервера
    server_name your-domain.com;

    # Максимальный размер загружаемой книги (например, через веб или API)
    client_max_body_size 200M;

    # Сжатие gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 1. Проксирование Backend API и OPDS каталогов
    # --------------------------------------------------------------------------
    location ~ ^/(api|opds|covers|health) {
        proxy_pass http://boyan_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Поддержка WebSocket / SSE (при необходимости)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2. Мобильное PWA-приложение (/m/)
    # --------------------------------------------------------------------------
    location /m/ {
        alias /var/www/boyan/web-mobile/;
        try_files $uri $uri/ /m/index.html;

        # Запрет кэширования Service Worker и манифеста PWA
        location ~* (sw\.js|registerSW\.js|manifest\.webmanifest)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # Долгосрочное кэширование статических файлов
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # --------------------------------------------------------------------------
    # 3. Десктопное веб-приложение (/)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/boyan/web-desktop;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Долгосрочное кэширование статических ассетов с хэшами
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
