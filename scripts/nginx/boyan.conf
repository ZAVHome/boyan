# ==============================================================================
# Конфигурация Nginx для комплекса «Боян» (Boyan) — Strict HTTPS Architecture
# Размещение: /etc/nginx/sites-available/boyan
# Активация: ln -s /etc/nginx/sites-available/boyan /etc/nginx/sites-enabled/
# ==============================================================================

# Пул бэкенда Go (по умолчанию слушает 127.0.0.1:8080)
upstream boyan_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server (Порт 80) — Исключительно ACME-валидация и 301-редирект на HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    
    # Выделенный субдомен библиотеки (например books.MYDOMAIN.COM)
    server_name books.MYDOMAIN.COM;

    # Валидация сертификатов Let's Encrypt (Certbot ACME challenge)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Все остальные запросы принудительно перенаправляются на защищенный HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server (Порт 443) — Вся работа комплекса «Боян»
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name books.MYDOMAIN.COM;

    # Пути к SSL/TLS сертификатам
    # (По умолчанию Let's Encrypt; при использовании заранее выпущенных сертификатов
    #  укажите пути к вашим fullchain.pem / privkey.pem)
    ssl_certificate /etc/letsencrypt/live/books.MYDOMAIN.COM/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/books.MYDOMAIN.COM/privkey.pem;

    # Современные параметры безопасности SSL/TLS
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Заголовки безопасности и HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Максимальный размер загружаемой книги (через веб-интерфейс или REST API)
    client_max_body_size 200M;

    # Сжатие gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # 2.1. Проксирование Backend API и OPDS каталогов
    # --------------------------------------------------------------------------
    location ~ ^/(api|opds|covers|health) {
        proxy_pass http://boyan_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Поддержка WebSocket / SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # 2.2. Мобильное PWA-приложение (/m/)
    # --------------------------------------------------------------------------
    location /m/ {
        alias /var/www/boyan/web-mobile/;
        try_files $uri $uri/ /m/index.html;

        # Запрет кэширования Service Worker и манифеста PWA
        location ~* (sw\.js|registerSW\.js|manifest\.webmanifest)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires 0;
        }

        # Долгосрочное кэширование статических файлов
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # --------------------------------------------------------------------------
    # 2.3. Десктопное веб-приложение (/)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/boyan/web-desktop;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Долгосрочное кэширование статических ассетов с хэшами
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
